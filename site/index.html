<h1>Luma QR 受付ツール</h1>
<p class="mute">ダークモードのLuma QR（白黒反転）を読み取るための受付用ツールです。カメラ映像は端末内で処理され、外部へ送信されません。</p>
<a class="card" href="scan.html"><b>① 反転対応スキャナ</b><span>受付スマホで参加者のQRを読み取り、チェックインURLを開きます。ライト／ダークの両方に対応します。</span></a>
<a class="card" href="mirror.html"><b>② 反転ミラー（中継用）</b><span>中継スマホで参加者の画面を撮影し、白黒反転して表示します。別のスキャナ（Lumaアプリ等）でその画面を読み取ります。</span></a>
<p class="mute">カメラの利用にはHTTPS（GitHub Pagesなど）と、ブラウザのカメラ許可が必要です。</p>
</main></body></html>
