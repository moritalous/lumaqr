<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>反転ミラー</title><link rel="stylesheet" href="style.css">
<style>
body{background:#000;color:#fff}
#v{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#v.inv{filter:invert(1) contrast(1.2)}
#ui{position:fixed;left:0;right:0;bottom:0;padding:12px;display:flex;gap:8px;justify-content:center;background:rgba(0,0,0,.45);transition:opacity .3s}
#ui.hide{opacity:0;pointer-events:none}
#msg{position:fixed;top:0;left:0;right:0;padding:12px;text-align:center}
</style></head>
<body>
<video id="v" playsinline muted class="inv"></video>
<div id="msg">カメラを起動しています…</div>
<div id="ui">
  <button id="inv">反転: ON</button>
  <button id="flip" class="sub">カメラ切替</button>
  <button id="hide" class="sub">UIを隠す</button>
  <a class="btn sub" href="./" style="background:#333">戻る</a>
</div>
<script>
const v=document.getElementById('v'),msg=document.getElementById('msg'),ui=document.getElementById('ui');
let facing='environment',stream=null,wl=null;
async function start(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    v.srcObject=stream;await v.play();msg.textContent='参加者の画面を映してください。受付側はこの画面を読み取ります。';
    setTimeout(()=>msg.style.display='none',4000);
    try{wl=await navigator.wakeLock?.request('screen')}catch{}
  }catch(e){msg.textContent='カメラを起動できません: '+e.message}
}
inv.onclick=()=>{const on=v.classList.toggle('inv');inv.textContent='反転: '+(on?'ON':'OFF')};
flip.onclick=()=>{facing=facing==='environment'?'user':'environment';start()};
hide.onclick=()=>ui.classList.add('hide');
v.onclick=()=>ui.classList.toggle('hide');
document.addEventListener('visibilitychange',async()=>{if(!document.hidden){try{wl=await navigator.wakeLock?.request('screen')}catch{}}});
start();
</script></body></html>
